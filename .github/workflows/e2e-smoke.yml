name: E2E Smoke Tests

on:
  push:
    branches: [ "main", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Cancel previous runs on the same branch when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-smoke:
    name: E2E Critical Flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble

    env:
      VITE_SUPABASE_URL: "https://mock-supabase-url.supabase.co"
      VITE_SUPABASE_ANON_KEY: "mock-supabase-anon-key"
      VITE_GOOGLE_MAPS_API_KEY: "mock-google-maps-api-key"
      HOME: /root

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      working-directory: frontend
      run: npm ci

    - name: Install Playwright Chromium Browser
      working-directory: frontend
      run: npx playwright install chromium

    - name: Run E2E Smoke Tests
      working-directory: frontend
      run: npx playwright test e2e/auth.spec.ts e2e/booking.spec.ts e2e/checkout.spec.ts --config=playwright.config.ts --project=chromium

