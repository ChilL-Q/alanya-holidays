name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel previous runs on the same branch when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of Least Privilege
permissions:
  contents: read

jobs:
  ci:
    name: Lint → Test → Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VITE_SUPABASE_URL: "https://mock-supabase-url.supabase.co"
      VITE_SUPABASE_ANON_KEY: "mock-supabase-anon-key"
      VITE_GOOGLE_MAPS_API_KEY: "mock-google-maps-api-key"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Security Audit
      run: npm audit --audit-level=high
      continue-on-error: true

    - name: Lint Code
      run: npm run lint

    - name: Type Check
      run: npm run type-check

    - name: Run Tests
      run: npm run test -- --run

    - name: Supabase Functions Lint
      run: npm run supabase:lint

    - name: Supabase Functions Type Check
      run: npm run supabase:type-check

    - name: Verify Build
      run: npm run build
      env:
        CI: true
