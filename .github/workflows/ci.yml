name: CI Pipeline

on:
  push:
    branches: [ "main", "dev", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

# Cancel previous runs on the same branch when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of Least Privilege
permissions:
  contents: read

jobs:
  ci:
    name: Lint → Test → Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VITE_SUPABASE_URL: "https://mock-supabase-url.supabase.co"
      VITE_SUPABASE_ANON_KEY: "mock-supabase-anon-key"
      VITE_GOOGLE_MAPS_API_KEY: "mock-google-maps-api-key"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Monorepo Type Check
      run: pnpm type-check

    - name: Monorepo Lint
      run: pnpm lint

    - name: Frontend Tests
      run: pnpm --filter @alanya-holidays/frontend test -- --run

    - name: Backend Tests
      run: pnpm --filter @alanya-holidays/backend test

    - name: Monorepo Build
      run: pnpm build
