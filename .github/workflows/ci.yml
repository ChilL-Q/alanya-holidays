name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: "https://mock-supabase-url.supabase.co"
      VITE_SUPABASE_ANON_KEY: "mock-supabase-anon-key"
      VITE_GOOGLE_MAPS_API_KEY: "mock-google-maps-api-key"
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Security Audit
      run: npm audit --audit-level=high

    - name: Lint Code
      run: npm run lint

    - name: Type Check
      run: npx tsc --noEmit

    - name: Run Tests
      run: npm run test -- --run

    - name: Verify Build
      run: npm run build
      env:
        CI: true
