name: CI Pipeline

on:
  push:
    branches: [ "main", "dev", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

# Cancel previous runs on the same branch when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of Least Privilege
permissions:
  contents: read

jobs:
  ci:
    name: Lint → Test → Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VITE_SUPABASE_URL: "https://mock-supabase-url.supabase.co"
      VITE_SUPABASE_ANON_KEY: "mock-supabase-anon-key"
      VITE_GOOGLE_MAPS_API_KEY: "mock-google-maps-api-key"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Turborepo Cache
      uses: actions/cache@v4
      with:
        path: |
          .turbo
          node_modules/.cache/turbo
        key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ github.ref_name }}-
          ${{ runner.os }}-turbo-

    - name: Monorepo Type Check
      run: pnpm type-check

    - name: Monorepo Lint
      run: pnpm lint

    - name: Frontend Tests
      run: pnpm --filter @alanya-holidays/frontend test -- --run

    - name: Backend Tests
      run: pnpm --filter @alanya-holidays/backend test

    - name: Monorepo Build
      run: pnpm build

  docker-and-compose-validation:
    name: Docker Builds & Compose Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Lint Docker Compose Configurations
      run: |
        cp .env.example .env
        docker compose -f docker-compose.yml config > /dev/null
        docker compose --env-file .env.example -f docker-compose.prod.yml config > /dev/null
        echo "✓ Docker Compose configurations valid."

    - name: Verify Backend Docker Build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: backend/Dockerfile
        push: false
        tags: alanya-holidays-backend:ci-check

    - name: Verify Frontend Production Docker Build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: frontend/Dockerfile.prod
        push: false
        build-args: |
          VITE_SUPABASE_URL=https://mock-supabase-url.supabase.co
          VITE_SUPABASE_ANON_KEY=mock-supabase-anon-key
          VITE_GOOGLE_MAPS_API_KEY=mock-google-maps-api-key
          VITE_APP_URL=https://alanyaholidays.com
          VITE_SENTRY_DSN=mock-sentry-dsn
        tags: alanya-holidays-frontend:ci-check

  db-schema-and-rls-verification:
    name: Database Migrations & RLS Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: alanya_holidays
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Initialize PostgreSQL Mock Schema & Extensions
      env:
        PGPASSWORD: postgrespassword
      run: |
        psql -h localhost -U postgres -d alanya_holidays -v ON_ERROR_STOP=1 -f test/fixtures/init_test_db.sql

    - name: Run Supabase SQL Migrations
      env:
        PGPASSWORD: postgrespassword
      run: |
        for migration in $(ls -1 supabase/migrations/*.sql | sort); do
          echo "Applying migration: $migration"
          psql -h localhost -U postgres -d alanya_holidays -v ON_ERROR_STOP=1 -f "$migration" || exit 1
        done
        echo "✓ All migrations successfully applied."

    - name: Execute RLS Security Verification
      env:
        PGPASSWORD: postgrespassword
      run: |
        psql -h localhost -U postgres -d alanya_holidays -v ON_ERROR_STOP=1 -f db_scripts/verify_rls_security.sql
