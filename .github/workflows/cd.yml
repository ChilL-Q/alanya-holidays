name: CD Production Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        if: ${{ env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            TARGET_DIR=""
            for dir in /opt/alanya-holidays ~/alanya-holidays /var/www/alanya-holidays; do
              if [ -d "$dir/.git" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="/opt/alanya-holidays"
              if [ ! -d "$TARGET_DIR/.git" ]; then
                mkdir -p "$TARGET_DIR"
                if [ -d "$TARGET_DIR" ] && [ "$(ls -A "$TARGET_DIR")" ]; then
                  cd "$TARGET_DIR"
                  git init
                  git remote add origin https://github.com/Nazarovruslan01/alanya-holidays.git || true
                  git fetch origin main
                  git checkout -B main origin/main
                else
                  git clone https://github.com/Nazarovruslan01/alanya-holidays.git "$TARGET_DIR"
                fi
              fi
            fi
            cd "$TARGET_DIR"
            git fetch origin main
            git reset --hard origin/main
            # Ensure VPS firewall allows HTTP (80), HTTPS (443), and SSH (22)
            if command -v ufw >/dev/null 2>&1; then
              ufw allow 80/tcp || true
              ufw allow 443/tcp || true
              ufw allow 22/tcp || true
              ufw --force enable || true
            fi
            if command -v iptables >/dev/null 2>&1; then
              iptables -I INPUT -p tcp --dport 80 -j ACCEPT || true
              iptables -I INPUT -p tcp --dport 443 -j ACCEPT || true
            fi
            [ -f .env.production ] || touch .env.production
            # Ensure SSL certificate directory and fallback certificates exist so Nginx can boot
            if [ ! -f "./certbot-data/conf/live/alanyaholidays.com/fullchain.pem" ]; then
              mkdir -p "./certbot-data/conf/live/alanyaholidays.com"
              openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
                -keyout "./certbot-data/conf/live/alanyaholidays.com/privkey.pem" \
                -out "./certbot-data/conf/live/alanyaholidays.com/fullchain.pem" \
                -subj "/CN=alanyaholidays.com" || true
            fi
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true
            docker image prune -f
