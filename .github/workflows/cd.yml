name: CD Production Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        if: ${{ env.VPS_HOST != '' && env.VPS_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ env.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            TARGET_DIR=""
            for dir in /opt/alanya-holidays ~/alanya-holidays /var/www/alanya-holidays; do
              if [ -d "$dir/.git" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="/opt/alanya-holidays"
              if [ ! -d "$TARGET_DIR/.git" ]; then
                mkdir -p "$TARGET_DIR"
                if [ -d "$TARGET_DIR" ] && [ "$(ls -A "$TARGET_DIR")" ]; then
                  cd "$TARGET_DIR"
                  git init
                  git remote add origin https://github.com/Nazarovruslan01/alanya-holidays.git || true
                  git fetch origin main
                  git checkout -B main origin/main
                else
                  git clone https://github.com/Nazarovruslan01/alanya-holidays.git "$TARGET_DIR"
                fi
              fi
            fi
            cd "$TARGET_DIR"
            git fetch origin main
            git reset --hard origin/main
            # Ensure VPS firewall and Docker forwarding allow HTTP (80), HTTPS (443), and SSH (22)
            if command -v ufw >/dev/null 2>&1; then
              ufw allow 80/tcp || true
              ufw allow 443/tcp || true
              ufw allow 22/tcp || true
              ufw route allow proto tcp from any to any port 80 || true
              ufw route allow proto tcp from any to any port 443 || true
              sed -i 's/DEFAULT_FORWARD_POLICY="DROP"/DEFAULT_FORWARD_POLICY="ACCEPT"/' /etc/default/ufw || true
              ufw reload || true
            fi
            if command -v iptables >/dev/null 2>&1; then
              iptables -I INPUT -p tcp --dport 80 -j ACCEPT || true
              iptables -I INPUT -p tcp --dport 443 -j ACCEPT || true
              iptables -I DOCKER-USER -p tcp --dport 80 -j ACCEPT || true
              iptables -I DOCKER-USER -p tcp --dport 443 -j ACCEPT || true
            fi
            [ -f .env.production ] || touch .env.production
            
            CERT_PATH="./certbot-data/conf/live/alanyaholidays.com/fullchain.pem"
            IS_LETS_ENCRYPT=0
            if [ -f "$CERT_PATH" ] && openssl x509 -in "$CERT_PATH" -noout -issuer 2>/dev/null | grep -qi "Let's Encrypt"; then
              IS_LETS_ENCRYPT=1
            fi

            # Ensure fallback dummy certificate exists if missing so Nginx can start
            if [ ! -f "$CERT_PATH" ]; then
              mkdir -p "./certbot-data/conf/live/alanyaholidays.com"
              mkdir -p "./certbot-data/www"
              docker run --rm -v "$(pwd)/certbot-data/conf:/etc/letsencrypt" \
                alpine sh -c "
                  apk add --no-cache openssl && \
                  mkdir -p /etc/letsencrypt/live/alanyaholidays.com && \
                  openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                    -keyout '/etc/letsencrypt/live/alanyaholidays.com/privkey.pem' \
                    -out '/etc/letsencrypt/live/alanyaholidays.com/fullchain.pem' \
                    -subj '/CN=alanyaholidays.com' && \
                  chmod -R 755 /etc/letsencrypt
                " || true
            fi

            # Start production containers
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # Obtain real Let's Encrypt certificate if not currently valid Let's Encrypt cert
            if [ "$IS_LETS_ENCRYPT" -eq 0 ]; then
              echo "Requesting trusted Let's Encrypt certificate for alanyaholidays.com..."
              rm -rf ./certbot-data/conf/live/alanyaholidays.com ./certbot-data/conf/archive/alanyaholidays.com ./certbot-data/conf/renewal/alanyaholidays.com.conf || true
              docker run --rm \
                -v "$(pwd)/certbot-data/conf:/etc/letsencrypt" \
                -v "$(pwd)/certbot-data/www:/var/www/certbot" \
                certbot/certbot certonly --webroot -w /var/www/certbot \
                  -d alanyaholidays.com -d www.alanyaholidays.com \
                  --email admin@alanyaholidays.com --rsa-key-size 4096 --agree-tos --non-interactive --force-renewal || true
              docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true
            else
              docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true
            fi

            docker image prune -f
