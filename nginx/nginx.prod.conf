events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # DNS Resolver for external upstreams & OCSP
    resolver 1.1.1.1 8.8.8.8 127.0.0.11 valid=300s ipv6=off;
    resolver_timeout 5s;

    # Supabase Upstream Host Definition (Single Source of Truth)
    map $host $supabase_host {
        default "mdmizeyiyebvhkujjyjg.supabase.co";
    }

    # Logging
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Body Size Limits & Timeouts
    client_max_body_size 10M;
    client_body_timeout 12s;
    client_header_timeout 12s;

    # Cloudflare Real IP Restoration
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=functions_limit:10m rate=15r/s;
    limit_req_status 429;

    # Storage Media RAM Cache Zone
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=api_cache:10m max_size=256m inactive=60m use_temp_path=off;

    # WebSocket Upgrade Header Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Baseline Security Headers & CSP (http-level fallback)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://*.supabase.co https://images.unsplash.com https://*.stripe.com https://ui-avatars.com https://*.googleusercontent.com https://*.tile.openstreetmap.org https://api.mapbox.com https://*.mapbox.com https://maps.googleapis.com https://maps.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://m.stripe.network https://q.stripe.com https://plausible.io; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://maps.google.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com;" always;

    # HTTP Server (Redirects to HTTPS + handles Certbot ACME challenge & Health check)
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /health {
            proxy_pass http://backend:4000/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/alanyaholidays.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/alanyaholidays.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling (Task 5.1)
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/alanyaholidays.com/fullchain.pem;

        root /usr/share/nginx/html;
        index index.html;

        # Frontend SPA Routing (Explicitly maintain all security headers alongside Cache-Control)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
            add_header X-Permitted-Cross-Domain-Policies "none" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://*.supabase.co https://images.unsplash.com https://*.stripe.com https://ui-avatars.com https://*.googleusercontent.com https://*.tile.openstreetmap.org https://api.mapbox.com https://*.mapbox.com https://maps.googleapis.com https://maps.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://m.stripe.network https://q.stripe.com https://plausible.io; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://checkout.stripe.com https://maps.google.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com;" always;
        }

        # Static Asset Caching (Explicitly maintain security headers alongside Cache-Control)
        location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|avif|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
            add_header X-Permitted-Cross-Domain-Policies "none" always;
            access_log off;
        }

        # Backend Health Check
        location /health {
            proxy_pass http://backend:4000/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Supabase Edge Functions Proxy (Single Origin Edge Gateway)
        location /functions/v1/ {
            limit_req zone=functions_limit burst=20 nodelay;
            proxy_pass https://$supabase_host$request_uri;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header Host $supabase_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Supabase Storage Image Proxy & Edge RAM Cache (Public immutable media assets only)
        location /storage/v1/object/public/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_cache api_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            proxy_ignore_headers Set-Cookie;
            proxy_hide_header Set-Cookie;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            proxy_pass https://$supabase_host$request_uri;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header Host $supabase_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dedicated Route for Stripe Webhooks
        location /api/webhooks/stripe {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://backend:4000/api/webhooks/stripe;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite (not append) so a spoofed client XFF chain cannot
            # rotate rate-limit buckets behind `trust proxy = 1`.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API Proxy (WebSockets Upgrade & Direct Proxy without unsafe edge microcaching - Task 5.2)
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;

            # Direct proxying without blanket edge microcache to eliminate private session leakage and stale mutation reads
            proxy_pass http://backend:4000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
