events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver 1.1.1.1 8.8.8.8 127.0.0.11 valid=30s ipv6=off;

    # Supabase Upstream Host Definition (Single Source of Truth)
    map $host $supabase_host {
        default "mdmizeyiyebvhkujjyjg.supabase.co";
    }

    server {
        listen 80;

        # Frontend Vite Dev Server + HMR WebSocket
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Backend Health Check
        location /health {
            proxy_pass http://backend:4000/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Backend REST API Proxy
        location /api/ {
            proxy_pass http://backend:4000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Supabase Edge Functions Proxy (Single Origin Edge Gateway)
        location /functions/v1/ {
            proxy_pass https://$supabase_host$request_uri;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header Host $supabase_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
